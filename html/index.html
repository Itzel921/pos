<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de PoS</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <!--Imagen en l esquina superior izquierda-->
    <img src="../img/oxxo.png" class="logo">


    <!--Titulo principal-->
    <div class="contenido">
        <div>
            <h1 class="titulo">OXXO Siempre cerca de ti</h1>
            <h2 class="subtitulo">No es bueno pero es barato :c</h2>
        </div>
    </div>
    
    <!--Imagen en l esquina superior derecha-->
    <img src="../img/logo2.png" class="logo2">

    <!--Area principal en blanco donde se muestran los productos-->
    <div class="contenedor">
        <table id="carrito">
            <tr>
                <th class="titulocantidad">Cantidad</th>
                <th>Producto</th>
                <th>Precio</th>
                <th>Total</th>
                <tbody id="cuerpo"></tbody>
            </tr>
        </table>
    </div>
</body>
</html>
