<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de PoS</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/function.js"></script>

</head>
<body>
    <!--Imagen en l esquina superior izquierda-->
    <img src="../img/oxxo.png" class="logo">


    <!--Titulo principal-->
    <div class="contenido">
        <div>
            <h1 class="titulo">OXXO Siempre cerca de ti</h1>
            <h2 class="subtitulo">No es bueno pero es barato :c</h2>
        </div>
    </div>
    
    <!--Imagen en l esquina superior derecha-->
    <img src="../img/logo2.png" class="logo2">

    <!--Area principal en blanco donde se muestran los productos-->
    <div class="contenedor">
        <table id="carrito">
            <tr>
                <th class="titulocantidad">Cantidad</th>
                <th>Producto</th>
                <th>Precio</th>
                <th>Total</th>
                <tbody id="cuerpo"></tbody>
            </tr>
        </table>
    </div>

    <!--unico input en todo el sistema-->
    <input type="text" id="codigodelproducto" class="claseinput" onkeydown="buscarproducto(event)" >

    <!-- Botones tipo oxxo -->
    <div class="contenedor2">
        <input type ="button" id="boton1" class="claseboton" onclick="cancelar_venta()">
        <input type ="button" id="boton2" class="claseboton" onclick="saldo_camion()">
        <input type ="button" id="boton3" class="claseboton" onclick="tranferencia()">
        <input type ="button" id="boton4" class="claseboton">
        <input type ="button" id="boton5" class="claseboton" onclick="pagar()">

        <div id="feedback" class="feedback"> </div>
        <div class="total">
            <h1 id="total">$0.00 </h1>
        </div>
    </div>


</body>
</html>
